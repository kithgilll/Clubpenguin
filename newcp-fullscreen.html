<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>New Club Penguin</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
  }
  #wrap {
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    width:100dvw; height:100dvh;
    overflow:hidden;
    background:#000;
  }
  iframe {
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    border:0;
  }
  #err {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:#0b3d5c;
    color:#fff;
    font-family:-apple-system, sans-serif;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    font-size:15px;
    line-height:1.5;
  }
  #err.show { display:flex; }
</style>
</head>
<body>
  <div id="wrap">
    <iframe id="gameFrame" src="https://newcp.net/play/" allow="fullscreen; autoplay" allowfullscreen></iframe>
  </div>
  <div id="err">
    Le site bloque l'affichage dans un cadre (protection anti-clickjacking).<br><br>
    Cette méthode ne fonctionne pas pour ce site — il faut repasser par l'ajout à l'écran d'accueil classique.
  </div>

  <script>
    const frame = document.getElementById('gameFrame');
    const errBox = document.getElementById('err');
    let loaded = false;

    frame.addEventListener('load', () => {
      loaded = true;
    });

    // Si l'iframe est bloquée (X-Frame-Options / CSP), le load ne se déclenche jamais
    // ou se déclenche sur une page vide : on détecte via timeout.
    setTimeout(() => {
      if (!loaded) {
        errBox.classList.add('show');
      }
    }, 4000);
  </script>
</body>
</html>
